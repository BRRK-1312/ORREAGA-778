/* =====================================================================

   ===================================================================== */
const cvs = document.getElementById('screen');
const dctx = cvs.getContext('2d');
const offc = document.createElement('canvas'); offc.width = W; offc.height = H;
const octx = offc.getContext('2d');
const IMG = octx.createImageData(W, H);
const FB = new Uint32Array(IMG.data.buffer);
const COL = new Uint32Array(HEX.length);
(function(){
  const b = new Uint8ClampedArray(4), v = new Uint32Array(b.buffer);
  for (let i = 0; i < HEX.length; i++){
    const n = parseInt(HEX[i].slice(1), 16);
    b[0] = n >> 16 & 255; b[1] = n >> 8 & 255; b[2] = n & 255; b[3] = 255;
    COL[i] = v[0];
  }
})();
let SC = 1, OX = 0, OY = 0, CW = 1, CH = 1;

function px(x, y, c){ x |= 0; y |= 0; if (x < 0 || y < 0 || x >= W || y >= H) return; FB[y * W + x] = COL[c]; }
function rect(x, y, w, h, c){
  x |= 0; y |= 0; let x1 = x + (w | 0), y1 = y + (h | 0);
  if (x < 0) x = 0; if (y < 0) y = 0; if (x1 > W) x1 = W; if (y1 > H) y1 = H;
  if (x >= x1 || y >= y1) return;
  const v = COL[c];
  for (let yy = y; yy < y1; yy++){ const o = yy * W; FB.fill(v, o + x, o + x1); }
}
function box(x, y, w, h, c){ rect(x, y, w, 1, c); rect(x, y + h - 1, w, 1, c); rect(x, y, 1, h, c); rect(x + w - 1, y, 1, h, c); }
const BAYER = new Uint8Array([0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5]);
function dith(x, y, w, h, c, lvl){            // trama ordenada 4x4, lvl 0..16
  x |= 0; y |= 0; let x1 = x + (w | 0), y1 = y + (h | 0);
  if (x < 0) x = 0; if (y < 0) y = 0; if (x1 > W) x1 = W; if (y1 > H) y1 = H;
  const v = COL[c];
  for (let yy = y; yy < y1; yy++){
    const r = (yy & 3) << 2, o = yy * W;
    for (let xx = x; xx < x1; xx++) if (BAYER[r | (xx & 3)] < lvl) FB[o + xx] = v;
  }
}
function dpx(x, y, c, lvl){ x |= 0; y |= 0; if (x < 0 || y < 0 || x >= W || y >= H) return; if (BAYER[((y & 3) << 2) | (x & 3)] < lvl) FB[y * W + x] = COL[c]; }
function line(x0, y0, x1, y1, c){
  x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;){
    px(x0, y0, c);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy){ err += dy; x0 += sx; }
    if (e2 <= dx){ err += dx; y0 += sy; }
  }
}
function ring(cx, cy, r, c, lvl){
  let x = r, y = 0, e = 1 - r;
  while (x >= y){
    dpx(cx + x, cy + y, c, lvl); dpx(cx - x, cy + y, c, lvl); dpx(cx + x, cy - y, c, lvl); dpx(cx - x, cy - y, c, lvl);
    dpx(cx + y, cy + x, c, lvl); dpx(cx - y, cy + x, c, lvl); dpx(cx + y, cy - x, c, lvl); dpx(cx - y, cy - x, c, lvl);
    y++; if (e < 0) e += 2 * y + 1; else { x--; e += 2 * (y - x) + 1; }
  }
}
/* espejo horizontal según orientación f (±1) */
function rf(x, y, dx, dy, w, h, c, f){ rect(f > 0 ? x + dx : x - dx - w + 1, y + dy, w, h, c); }
function pf(x, y, dx, dy, c, f){ px(x + dx * f, y + dy, c); }

function hash(x, y){
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
}
function fbm(x, y){ return vnoise(x, y) * 0.6 + vnoise(x * 2.1 + 17, y * 2.1 + 5) * 0.3 + vnoise(x * 4.3 + 3, y * 4.3 + 11) * 0.1; }
function sstep(a, b, x){ let t = (x - a) / (b - a); t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); }
function saveBG(){ return FB.slice(); }
function loadBG(b){ FB.set(b); }

function resize(){
  const r = cvs.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  CW = Math.max(1, Math.round(r.width * dpr)); CH = Math.max(1, Math.round(r.height * dpr));
  if (cvs.width !== CW) cvs.width = CW;
  if (cvs.height !== CH) cvs.height = CH;
  SC = Math.max(1, Math.floor(Math.min(CW / W, CH / H)));   // mayor escala entera
  OX = (CW - W * SC) >> 1; OY = (CH - H * SC) >> 1;          // centrado con bandas
}
function present(){
  octx.putImageData(IMG, 0, 0);
  dctx.imageSmoothingEnabled = false;
  dctx.clearRect(0, 0, CW, CH);
  dctx.drawImage(offc, 0, 0, W, H, OX, OY, W * SC, H * SC);
}

const WRAPC = new Map();
function wrap(s, mw){ // líneas cacheadas por ancho

  let r = m.get(s); if (r) return r;
  r = []; const words = s.split(' '); let cur = '';

/* ---------- Fuente EUSKObaroque: se carga con FontFace desde una URL data: incrustada ---------- */
let otfReady = false, otfFailed = false;
const OTFC = new Map();
function loadOTF(){
  try {
    const ff = new FontFace('EUSKObaroque', 'url(' + FONT_URL + ')');
    return ff.load().then(function(f){ document.fonts.add(f); otfReady = true; }, function(){ otfFailed = true; });
  } catch (err) { otfFailed = true; return Promise.resolve(); }
}
/* Rasteriza el texto con la fuente real a la resolución lógica, sin suavizado (umbral de alfa)
   y guarda una máscara de relleno y otra de contorno. Solo se usa para títulos. */
function otfMask(s, size){
  const key = size + '|' + s;
  let M = OTFC.get(key); if (M) return M;
  const c = document.createElement('canvas'), g = c.getContext('2d');
  const font = size + 'px EUSKObaroque';
  g.font = font;
  const tw = Math.ceil(g.measureText(s).width) + 8, th = Math.ceil(size * 1.5) + 8;
  c.width = tw; c.height = th; g.font = font; g.fillStyle = '#fff'; g.textBaseline = 'alphabetic';
  g.fillText(s, 4, Math.round(size * 1.0) + 4);
  const d = g.getImageData(0, 0, tw, th).data;
  let x0 = tw, y0 = th, x1 = -1, y1 = -1;
  for (let y = 0; y < th; y++) for (let x = 0; x < tw; x++) if (d[(y * tw + x) * 4 + 3] >= 120){ if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0){ M = { w: 0, h: 0, m: new Uint8Array(0), o: new Uint8Array(0) }; OTFC.set(key, M); return M; }
  const w = x1 - x0 + 3, h = y1 - y0 + 3, m = new Uint8Array(w * h), o = new Uint8Array(w * h);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (d[(y * tw + x) * 4 + 3] >= 120) m[(y - y0 + 1) * w + (x - x0 + 1)] = 1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    if (m[y * w + x]) continue;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
      const xx = x + dx, yy = y + dy;
      if (xx >= 0 && yy >= 0 && xx < w && yy < h && m[yy * w + xx]){ o[y * w + x] = 1; dy = 2; break; }
    }
  }
  M = { w: w, h: h, m: m, o: o }; OTFC.set(key, M); return M;
}
function drawOTF(s, size, x, y, c, oc){ // x,y = esquina superior izquierda; oc = color de contorno (-1 sin contorno)
  const M = otfMask(s, size); x |= 0; y |= 0;
  const vc = COL[c], vo = oc >= 0 ? COL[oc] : 0;
  for (let yy = 0; yy < M.h; yy++){
    const Y = y + yy; if (Y < 0 || Y >= H) continue;
    for (let xx = 0; xx < M.w; xx++){
      const X = x + xx; if (X < 0 || X >= W) continue;
      const i = yy * M.w + xx;
      if (M.m[i]) FB[Y * W + X] = vc; else if (oc >= 0 && M.o[i]) FB[Y * W + X] = vo;
    }
  }
  return M;
}
function drawOTFC(s, size, cx, y, c, oc){ const M = otfMask(s, size); drawOTF(s, size, cx - (M.w >> 1), y, c, oc); return M; }
function titleText(s, size, cx, y, c, oc){ // EUSKObaroque si está cargada; si no, fuente de píxeles grande
  if (otfReady) return drawOTFC(s, size, cx, y, c, oc).h;
  const w = measure(s) * 2; textBig(s, cx - (w >> 1), y, c); return 14;
}

    for (let r = 0; r < 7; r++) for (let k = 0; k < gl.w; k++) if (gl.m[r] & (1 << k)){ const yy = r + 1, xx = x + k; if (xx < w && yy < h) v[yy * w + xx] = COL[INK]; }

function update(){
  tick++; if (tick % ANIM === 0) animTick++;
  sceneT++;
  if (hit[A_MUTE]) muted = !muted;
  switch (scene){
    case S_LOAD: if (otfReady || otfFailed || sceneT > 600) go(S_TITLE); break;
    case S_TITLE: updTitle(); break;
    case S_HOWTO: case S_HIST: updPage(); break;
    case S_INTRO: updIntro(); break;
    case S_PLAY: updPlay(); break;
    case S_WIN: updWin(); break;
    case S_INTER: updInter(); break;
    case S_FINAL: updFinal(); break;
  }
  hit.fill(0); ptrClick = -1; ptrTap = 0; mouseMoved = 0;
}
function render(){
  hrN = 0;
  switch (scene){
    case S_LOAD: drawLoad(); break;
    case S_TITLE: drawTitle(); break;
    case S_HOWTO: drawHowto(); break;
    case S_HIST: drawHist(); break;
    case S_INTRO: drawIntro(); break;
    case S_PLAY: drawPlayScene(); break;
    case S_WIN: drawWin(); break;
    case S_INTER: drawInter(); break;
    case S_FINAL: drawFinal(); break;
  }
  present();
  const play = (scene === S_PLAY && !paused && !G.lose && !G.dialog && G.info < 0) ? 1 : 0;
  if (play !== lastPlay){ lastPlay = play; document.body.classList.toggle('play', play === 1); if (!play){ for (let i = 0; i < TOUCHMAP.length; i++) held[TOUCHMAP[i][1]] = 0; } }
}
BGS[0] = genParallax(0); BGS[1] = genParallax(1);
const BG_INTER = genInterBG();
resize();
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', function(){ if (document.hidden && scene === S_PLAY && !G.lose) paused = true; });
loadOTF();
go(S_LOAD);
cvs.focus({ preventScroll: true });
let lastT = performance.now(), acc = 0;
function frame(now){
  let dt = now - lastT; lastT = now;
  if (dt > 250) dt = 250; if (dt < 0) dt = 0;
  acc += dt;
  while (acc >= STEP){ update(); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
